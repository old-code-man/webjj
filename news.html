<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>词元Web - AI 最新资讯</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="news-styles.css">
</head>
<body class="news-page">
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-title">词元Web</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">总览</a>
                <a href="ranking.html" class="nav-link">排行榜</a>
                <a href="news.html" class="nav-link active">AI资讯</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区：三个模块同屏显示 -->
    <main class="container">
        <h1 class="page-title">AI 最新资讯<span class="update-date" id="update-date">(更新于2026-09-23)</span></h1>

        <div class="news-dashboard">
            <!-- 模块一：最新资讯 -->
            <section class="news-module" id="module-news">
                <header class="module-head">
                    <h2 class="module-title"><span class="module-icon">📰</span>最新资讯</h2>
                    <span class="module-count" id="news-count"></span>
                </header>
                <div class="news-filters" id="news-filters"></div>
                <div class="module-body" id="news-list">
                    <div class="news-empty">加载数据中...</div>
                </div>
            </section>

            <!-- 模块二：名人言论 -->
            <section class="news-module" id="module-quotes">
                <header class="module-head">
                    <h2 class="module-title"><span class="module-icon">💬</span>名人言论</h2>
                    <span class="module-count" id="quote-count"></span>
                </header>
                <div class="module-body" id="quote-list">
                    <div class="news-empty">加载数据中...</div>
                </div>
            </section>

            <!-- 模块三：新产品 -->
            <section class="news-module" id="module-products">
                <header class="module-head">
                    <h2 class="module-title"><span class="module-icon">🚀</span>新产品</h2>
                    <span class="module-count" id="product-count"></span>
                </header>
                <div class="module-body" id="product-list">
                    <div class="news-empty">加载数据中...</div>
                </div>
            </section>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <p>&copy; 2026 词元Web. 保留所有权利.联系:ciyuanweb@qq.com</p>
    </footer>

    <script src="data/news.js"></script>
    <script src="news-script.js"></script>
</body>
</html>
